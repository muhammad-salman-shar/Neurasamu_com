<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — NeuraSaMu</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body{background:var(--bg);min-height:100vh}
  .not-found{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:80px 20px;text-align:center;position:relative;z-index:2}
  .nf-inner{max-width:520px}
  .nf-code{font-family:var(--serif);font-style:italic;font-size:clamp(5rem,14vw,9rem);font-weight:500;letter-spacing:-.04em;line-height:1;color:var(--accent);opacity:.32;margin-bottom:8px}
  .nf-title{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.025em;line-height:1.15;color:var(--ink);margin-bottom:16px}
  .nf-text{font-size:1rem;line-height:1.7;color:var(--ink-2);margin-bottom:32px;max-width:48ch;margin-inline:auto}
  .nf-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
<script data-goatcounter="https://neurasamu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main class="not-found">
  <div class="nf-inner">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Page not found.</h1>
    <p class="nf-text">The page you were looking for does not exist, or has moved. Return to the lab or explore the research corpus.</p>
    <div class="nf-actions">
      <a class="btn btn--primary" href="/">Back to home</a>
      <a class="btn btn--ghost" href="/research/">See research</a>
    </div>
  </div>
</main>
<script src="/assets/config.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
